name: Web

on:
  push:
    paths: ['apps/web/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web
