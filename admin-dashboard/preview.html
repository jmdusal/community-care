// Stacked horizontal bar for verification states

  const total = Object.values(STATUS_COUNTS).reduce((a, b) => a + b, 0);
  return (
    <div>
      <div className="flex h-3 w-full overflow-hidden rounded-full bg-slate-100 gap-0.5">
        {Object.entries(STATUS_COUNTS).map(([k, v]) => (
          <div key={k} className={STATUS[k].bar} style={{ width: `${Math.max((v / total) * 100, 0.6)}%` }} title={`${STATUS[k].label}: ${v.toLocaleString()}`} />
        ))}
      </div>
      <ul className="mt-4 grid grid-cols-2 sm:grid-cols-5 gap-3">
        {Object.entries(STATUS_COUNTS).map(([k, v]) => (
          <li key={k} className="flex flex-col">
            <span className="flex items-center gap-1.5 text-xs text-slate-500">
              <span className={`w-2 h-2 rounded-full ${STATUS[k].bar}`} />
              {STATUS[k].label}
            </span>
            <span className="text-sm font-semibold text-slate-900 tabular-nums">{v.toLocaleString()}</span>
            <span className="text-[11px] text-slate-400 tabular-nums">{((v / total) * 100).toFixed(1)}%</span>

        ))}

      <p className="mt-4 text-[11px] leading-relaxed text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">

}

// Sparkline-style area chart (SVG)
function SearchTrend() {
  const w = 320, h = 96, pad = 4;
  const max = Math.max(...SEARCH_TREND), min = Math.min(...SEARCH_TREND);
  const pts = SEARCH_TREND.map((v, i) => [pad + (i * (w - pad * 2)) / (SEARCH_TREND.length - 1), h - pad - ((v - min) / (max - min)) * (h - pad * 2)]);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area = `${line} L${pts[pts.length - 1][0]},${h} L${pts[0][0]},${h} Z`;
  const last = pts[pts.length - 1];
  return (
    <div>
      <div className="flex items-end gap-6 mb-3">
        <div>
          <div className="text-2xl font-semibold text-slate-900 tabular-nums">108k</div>
          <div className="text-xs text-slate-500">searches today</div>
        </div>
        <div>
          <div className="text-2xl font-semibold text-slate-900 tabular-nums">71%</div>
          <div className="text-xs text-slate-500">opened a facility profile</div>
        </div>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-24" preserveAspectRatio="none" role="img" aria-label="Daily searches over the last 14 days, trending up">
        <defs>
          <linearGradient id="trendFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor="#14b8a6" stopOpacity="0.25" />
            <stop offset="100%" stopColor="#14b8a6" stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={area} fill="url(#trendFill)" />
        <path d={line} fill="none" stroke="#0d9488" strokeWidth="2" vectorEffect="non-scaling-stroke" />
        <circle cx={last[0]} cy={last[1]} r="3.5" fill="#0d9488" />
      </svg>
      <div className="flex justify-between text-[11px] text-slate-400 mt-1">
        <span>Oct 25</span>
        <span>Nov 7</span>
      </div>
    </div>
  );
}

// Ring gauge for AI grounding
function Ring({ value, label, color = "#0d9488" }) {
  const r = 28, c = 2 * Math.PI * r;
  return (
    <div className="flex flex-col items-center gap-1.5">
      <div className="relative w-20 h-20">
        <svg viewBox="0 0 72 72" className="w-20 h-20 -rotate-90">
          <circle cx="36" cy="36" r={r} fill="none" stroke="#e2e8f0" strokeWidth="7" />
          <circle cx="36" cy="36" r={r} fill="none" stroke={color} strokeWidth="7" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - value / 100)} />
        </svg>
        <div className="absolute inset-0 grid place-items-center text-sm font-semibold text-slate-900 tabular-nums">{value}%</div>
      </div>
      <span className="text-[11px] text-center text-slate-500 leading-tight">{label}</span>
    </div>
  );
}

// ---------- Verification queue (interactive) ----------
function VerificationQueue({ rows, onDecide, compact = false }) {
  const [filter, setFilter] = useState("all");
  const visible = useMemo(() => {
    if (filter === "flagged") return rows.filter((r) => r.flag);
    if (filter === "pending") return rows.filter((r) => r.status === "pending_review");
    return rows;
  }, [rows, filter]);

  return (
    <Card
      title="Verification queue"
      subtitle="Edits and imports awaiting review. Editing and approval are separated (four-eyes)."
      action={
        <div className="flex rounded-lg border border-slate-200 p-0.5 text-xs">
          {[["all", "All"], ["pending", "Pending"], ["flagged", "Flagged"]].map(([k, l]) => (
            <button key={k} onClick={() => setFilter(k)} className={`px-2.5 py-1 rounded-md ${filter === k ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-100"}`}>
              {l}
            </button>
          ))}
        </div>
      }
    >
      <div className="-mx-5 -mb-5 overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-[11px] uppercase tracking-wide text-slate-500 border-y border-slate-200 bg-slate-50">
              <th className="px-5 py-2.5 font-medium">Facility</th>
              <th className="px-3 py-2.5 font-medium">Proposed change</th>
              {!compact && <th className="px-3 py-2.5 font-medium">Source</th>}
              <th className="px-3 py-2.5 font-medium">Waiting</th>
              <th className="px-3 py-2.5 font-medium">Status</th>
              <th className="px-5 py-2.5 font-medium text-right">Action</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {visible.map((r) => (
              <tr key={r.id} className="hover:bg-slate-50/60 align-top">
                <td className="px-5 py-3 min-w-[220px]">
                  <div className="font-medium text-slate-900">{r.name}</div>
                  <div className="text-xs text-slate-500">
                    {r.type} · {r.location}
                  </div>
                  <div className="text-[11px] text-slate-400 font-mono mt-0.5">{r.id}</div>
                </td>
                <td className="px-3 py-3 min-w-[200px]">
                  <div className="text-slate-700">{r.change}</div>
                  {r.flag && (
                    <span className="mt-1 inline-flex items-center gap-1 text-[11px] text-rose-700">
                      <Icon name="alert" className="w-3.5 h-3.5" /> {r.flag}
                    </span>
                  )}
                </td>
                {!compact && (
                  <td className="px-3 py-3 text-xs text-slate-600 whitespace-nowrap">
                    {r.source}
                    <div className="text-slate-400">by {r.submittedBy}</div>
                  </td>
                )}
                <td className={`px-3 py-3 text-xs whitespace-nowrap tabular-nums ${r.age.endsWith("d") && parseInt(r.age) >= 7 ? "text-rose-600 font-medium" : "text-slate-600"}`}>{r.age}</td>
                <td className="px-3 py-3">
                  <Chip className={STATUS[r.status].chip}>{STATUS[r.status].label}</Chip>
                </td>
                <td className="px-5 py-3 text-right whitespace-nowrap">
                  {r.status === "pending_review" ? (
                    r.ownEdit ? (
                      <span className="text-[11px] text-slate-400" title="You submitted this change; another verifier must approve it.">Needs another reviewer</span>
                    ) : (
                      <div className="inline-flex gap-1.5">
                        <button onClick={() => onDecide(r.id, "rejected")} className="px-2.5 py-1 text-xs rounded-md border border-slate-300 text-slate-700 hover:bg-slate-100">
                          Reject
                        </button>
                        <button onClick={() => onDecide(r.id, "verified")} className="px-2.5 py-1 text-xs rounded-md bg-teal-600 text-white hover:bg-teal-700">
                          Approve
                        </button>
                      </div>
                    )
                  ) : (
                    <button onClick={() => onDecide(r.id, "pending_review")} className="text-xs text-slate-500 hover:text-slate-800 underline underline-offset-2">
                      Undo
                    </button>
                  )}
                </td>
              </tr>
            ))}
            {visible.length === 0 && (
              <tr>
                <td colSpan={6} className="px-5 py-10 text-center text-sm text-slate-500">
                  Nothing here. The queue is clear.
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

function ImportBatches() {

      <ul className="space-y-4">
        {IMPORTS.map((b) => (
          <li key={b.id}>
            <div className="flex items-center justify-between gap-3">
              <div className="min-w-0">
                <div className="text-sm font-medium text-slate-900 truncate">
                  <span className="text-slate-400 font-mono mr-1.5">{b.id}</span>
                  {b.source}
                </div>
                <div className="text-xs text-slate-500">
                  {b.started} · {b.processed.toLocaleString()} processed{b.flagged ? ` · ${b.flagged} flagged` : ""}

              </div>
              <Chip className={IMPORT_STATUS[b.status].chip}>{IMPORT_STATUS[b.status].label}</Chip>

            <div className="mt-2 h-1.5 rounded-full bg-slate-100 overflow-hidden">
              <div className={`h-full rounded-full ${IMPORT_STATUS[b.status].bar} ${b.status === "running" ? "animate-pulse" : ""}`} style={{ width: `${b.progress}%` }} />

      </ul>

}

function AssistantHealth() {

        <dt className="text-slate-500">Questions answered</dt>
        <dd className="text-right font-medium text-slate-900 tabular-nums">12,940</dd>
        <dt className="text-slate-500">Emergency redirects shown</dt>
        <dd className="text-right font-medium text-slate-900 tabular-nums">318</dd>
        <dt className="text-slate-500">Blocked prompt-injection attempts</dt>
        <dd className="text-right font-medium text-slate-900 tabular-nums">21</dd>

}

function AuditFeed() {
  return (
    <Card title="Recent admin activity" subtitle="From audit_logs. No medical data is recorded here." action={<button className="text-xs font-medium text-teal-700 hover:text-teal-800">View all</button>}>
      <ol className="relative border-l border-slate-200 ml-1.5 space-y-4">
        {AUDIT.map((a, i) => (
          <li key={i} className="ml-4">
            <span className="absolute -left-[5px] mt-1.5 w-2.5 h-2.5 rounded-full bg-white border-2 border-teal-500" />
            <p className="text-sm text-slate-700">
              <span className="font-medium text-slate-900">{a.actor}</span> <span className="text-slate-400 text-xs">({a.role})</span> {a.action} <span className="font-medium text-slate-900">{a.target}</span>

          </li>

function Roadmap() {
  return (
    <Card title="Release roadmap" subtitle="Indicative 16-week plan from the technical design.">
      <ol className="space-y-2.5">
        {ROADMAP.map((p, i) => (
          <li key={p.phase} className="grid grid-cols-[18px_1fr_44px] items-center gap-3 text-xs">
            <span className={`grid place-items-center w-[18px] h-[18px] rounded-full text-[10px] font-semibold ${p.done === 100 ? "bg-teal-600 text-white" : p.done > 0 ? "bg-teal-100 text-teal-800" : "bg-slate-100 text-slate-500"}`}>{i + 1}</span>
            <div>
              <div className="flex justify-between">
                <span className="text-slate-700">{p.phase}</span>
                <span className="text-slate-400">wk {p.weeks}</span>
              </div>
              <div className="mt-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                <div className="h-full bg-teal-500 rounded-full" style={{ width: `${p.done}%` }} />
              </div>
            </div>
            <span className="text-right tabular-nums text-slate-600">{p.done}%</span>

// ---------- Layout ----------
function Sidebar({ active, onNavigate, open, onClose, pending }) {
  return (
    <>
      <div className={`fixed inset-0 z-30 bg-slate-900/40 lg:hidden ${open ? "block" : "hidden"}`} onClick={onClose} />
      <aside className={`fixed z-40 inset-y-0 left-0 w-64 bg-[#13293f] text-slate-300 flex flex-col transition-transform lg:translate-x-0 ${open ? "translate-x-0" : "-translate-x-full"}`}>
        <div className="flex items-center gap-2.5 px-5 h-16 border-b border-white/10">
          <div className="grid place-items-center w-8 h-8 rounded-lg bg-teal-500 text-white font-bold text-sm">C</div>
          <div className="leading-tight">
            <div className="text-white font-semibold text-sm">CommunityCare AI</div>
            <div className="text-[11px] text-slate-400">Admin console</div>
          </div>
          <button className="ml-auto lg:hidden text-slate-400 hover:text-white" onClick={onClose} aria-label="Close menu">
            <Icon name="x" />
          </button>
        </div>
        <nav className="flex-1 overflow-y-auto px-3 py-4 space-y-6">
          {NAV.map((group) => (
            <div key={group.section}>
              <div className="px-2 mb-1.5 text-[10px] font-semibold uppercase tracking-wider text-slate-500">{group.section}</div>
              <ul className="space-y-0.5">
                {group.items.map((item) => {
                  const isActive = active === item.key;
                  const badge = item.key === "verification" ? pending : item.badge;
                  return (
                    <li key={item.key}>
                      <button
                        onClick={() => onNavigate(item.key)}
                        className={`w-full flex items-center gap-3 px-2.5 py-2 rounded-lg text-sm transition-colors ${isActive ? "bg-white/10 text-white" : "hover:bg-white/5 hover:text-white"}`}
                        aria-current={isActive ? "page" : undefined}
                      >
                        <Icon name={item.icon} className={`w-[18px] h-[18px] ${isActive ? "text-teal-400" : ""}`} />
                        <span className="flex-1 text-left">{item.label}</span>
                        {badge ? <span className="text-[10px] font-semibold bg-amber-400 text-slate-900 rounded-full px-1.5 py-0.5 tabular-nums">{badge}</span> : null}
                      </button>
                    </li>
                  );
                })}
              </ul>
            </div>
          ))}
        </nav>
        <div className="p-4 border-t border-white/10 text-[11px] text-slate-400">
          <div className="flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-emerald-400" /> API /api/v1 · healthy
          </div>
          <div className="mt-1">Environment: <span className="text-amber-300">staging</span></div>
        </div>
      </aside>
    </>
  );
}

function Topbar({ onMenu, title }) {
  return (
    <header className="sticky top-0 z-20 h-16 bg-white/90 backdrop-blur border-b border-slate-200 flex items-center gap-3 px-4 sm:px-6">
      <button className="lg:hidden text-slate-600" onClick={onMenu} aria-label="Open menu">
        <Icon name="menu" />
      </button>
      <h1 className="text-base font-semibold text-slate-900 truncate">{title}</h1>
      <div className="ml-auto flex items-center gap-2 sm:gap-3">
        <label className="hidden md:flex items-center gap-2 w-72 h-9 px-3 rounded-lg border border-slate-200 bg-slate-50 text-sm text-slate-500 focus-within:ring-2 focus-within:ring-teal-500/40">
          <Icon name="search" className="w-4 h-4" />
          <input className="bg-transparent outline-none flex-1 placeholder:text-slate-400 text-slate-800" placeholder="Search facilities, PSGC code, batch…" />
        </label>
        <button className="relative grid place-items-center w-9 h-9 rounded-lg text-slate-600 hover:bg-slate-100" aria-label="Notifications">
          <Icon name="bell" />
          <span className="absolute top-2 right-2 w-2 h-2 rounded-full bg-rose-500" />
        </button>
        <div className="flex items-center gap-2 pl-2 sm:border-l border-slate-200">
          <div className="grid place-items-center w-8 h-8 rounded-full bg-teal-100 text-teal-800 text-xs font-semibold">MR</div>
          <div className="hidden sm:block leading-tight">
            <div className="text-sm font-medium text-slate-900">Maria Reyes</div>
            <div className="text-[11px] text-slate-500">Data verifier</div>
          </div>
        </div>
      </div>
    </header>
  );
}

function Toast({ toast }) {
  if (!toast) return null;
  return (
    <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2 rounded-lg bg-slate-900 text-white text-sm px-4 py-2.5 shadow-lg">
      <Icon name="check" className="w-4 h-4 text-teal-400" />
      {toast}
    </div>
  );
}

function Placeholder({ k }) {
  const label = NAV.flatMap((g) => g.items).find((i) => i.key === k)?.label;
  return (
    <Card>
      <div className="py-16 text-center">
        <div className="mx-auto grid place-items-center w-12 h-12 rounded-xl bg-teal-50 text-teal-700">
          <Icon name={NAV.flatMap((g) => g.items).find((i) => i.key === k)?.icon || "dashboard"} className="w-6 h-6" />
        </div>
        <h2 className="mt-4 text-base font-semibold text-slate-900">{label}</h2>
        <p className="mt-1 text-sm text-slate-500 max-w-md mx-auto">{MODULE_NOTES[k]}</p>
        <p className="mt-4 text-xs text-slate-400">Screen not designed yet in this sample.</p>
      </div>
    </Card>
  );
}

// ---------- Page ----------
function AdminDashboard() {
  const [active, setActive] = useState("dashboard");
  const [menuOpen, setMenuOpen] = useState(false);
  const [queue, setQueue] = useState(INITIAL_QUEUE);
  const [toast, setToast] = useState(null);

  const pending = 36 + queue.filter((r) => r.status === "pending_review").length;

  const decide = (id, status) => {
    setQueue((q) => q.map((r) => (r.id === id ? { ...r, status } : r)));
    const row = queue.find((r) => r.id === id);
    const msg = status === "verified" ? `Approved and published: ${row.name}` : status === "rejected" ? `Rejected: ${row.name} (reason required in real flow)` : `Returned to queue: ${row.name}`;
    setToast(msg);
    clearTimeout(window.__ccToast);
    window.__ccToast = setTimeout(() => setToast(null), 2600);
  };

  const navigate = (k) => {
    setActive(k);
    setMenuOpen(false);
  };

  const title = NAV.flatMap((g) => g.items).find((i) => i.key === active)?.label;

  return (
    <div className="min-h-screen bg-slate-50 font-sans text-slate-800">
      <Sidebar active={active} onNavigate={navigate} open={menuOpen} onClose={() => setMenuOpen(false)} pending={pending} />
      <div className="lg:pl-64">
        <Topbar onMenu={() => setMenuOpen(true)} title={title} />
        <main className="p-4 sm:p-6 space-y-6 max-w-[1400px]">
          {active === "dashboard" && (
            <>
              <div className="flex flex-wrap items-end justify-between gap-3">
                <div>
                  <p className="text-sm text-slate-500">Saturday, November 7, 2026</p>
                  <h2 className="text-xl font-semibold text-slate-900">Good morning, Maria</h2>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => navigate("imports")} className="h-9 px-3 rounded-lg border border-slate-300 bg-white text-sm text-slate-700 hover:bg-slate-50">Start import</button>
                  <button onClick={() => navigate("verification")} className="h-9 px-3 rounded-lg bg-teal-600 text-white text-sm font-medium hover:bg-teal-700">Review queue ({pending})</button>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
                {KPIS.map((k) => (
                  <KpiCard key={k.label} {...k} />
                ))}
              </div>

              <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <Card title="Verification status" subtitle="All facility records by platform review state" className="xl:col-span-2">
                  <StatusBreakdown />
                </Card>
                <Card title="Public directory usage" subtitle="Daily searches, last 14 days">
                  <SearchTrend />
                </Card>
              </div>

              <VerificationQueue rows={queue} onDecide={decide} compact />

              <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <Card title="Verified records by region" subtitle="Verified vs total facilities (PSGC region)">
                  <RegionBars />
                  <div className="mt-4 flex gap-4 text-[11px] text-slate-500">
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-teal-500" />Verified</span>
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-slate-300" />Total</span>
                  </div>
                </Card>
                <ImportBatches />
                <AssistantHealth />
              </div>

              <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <AuditFeed />
                <Roadmap />
              </div>
            </>
          )}

          {active === "verification" && <VerificationQueue rows={queue} onDecide={decide} />}
          {active === "imports" && <ImportBatches />}
          {active === "assistant" && <AssistantHealth />}
          {active === "audit" && <AuditFeed />}
          {!["dashboard", "verification", "imports", "assistant", "audit"].includes(active) && <Placeholder k={active} />}
        </main>
      </div>
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AdminDashboard />);
  </script>
</body>
